name: Agent governance

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: agent-governance-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent-governance:
    name: agent-governance
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete PR history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Do not execute package lifecycle scripts from an untrusted PR. The
      # governance and Jest checks only need the declared root dependencies.
      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Run Agent governance gate
        run: npm run governance:check -- --base "${{ github.event.pull_request.base.sha }}" --branch "${{ github.head_ref }}"

      - name: Run governance tests
        run: npm run test:governance
